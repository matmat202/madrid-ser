<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Se paga aquí? · SER Madrid</title>
<meta name="description" content="La plaza SER donde estás: verde o azul, si se paga ahora, hasta cuándo puedes quedarte y el aparcamiento municipal más cercano. Datos abiertos del Ayuntamiento de Madrid.">
<style>
  :root { --ink: #1b1f24; --mute: #5b6470; --line: #d9dee4; --bg: #f6f7f9; --card: #fff;
          --verde: #1f8a4c; --azul: #1f5fbf; --alta: #6a3fb5; --naranja: #d86a12; --rojo: #c4302b; --free: #0d7a5f; --paid: #9a3412; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8eaed; --mute: #a3acb7; --line: #343a42; --bg: #14171b; --card: #1d2126; --free: #3ccf9f; --paid: #f59e6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 34rem; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.35rem; margin: .25rem 0 .1rem; }
  .sub { color: var(--mute); margin: 0 0 1rem; font-size: .95rem; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; }
  button, select { font: inherit; padding: .7rem .8rem; border-radius: .6rem; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button.go { background: #1f5fbf; color: #fff; border-color: #1f5fbf; font-weight: 600; flex: 1 1 12rem; }
  select { flex: 1 1 10rem; min-width: 0; max-width: 100%; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: .8rem; padding: .9rem 1rem; margin: .8rem 0; }
  .zone { border-left: .5rem solid var(--c, var(--line)); }
  .zone h2 { font-size: 1.05rem; margin: 0 0 .3rem; display: flex; justify-content: space-between; gap: .5rem; }
  .zone h2 small { color: var(--mute); font-weight: 400; font-size: .85rem; }
  .state { font-size: 1.25rem; font-weight: 700; margin: .1rem 0; }
  .state.paid { color: var(--paid); } .state.free { color: var(--free); }
  .line { margin: .15rem 0; }
  .mute { color: var(--mute); font-size: .9rem; }
  .parks h2 { font-size: 1rem; margin: 0 0 .4rem; }
  .parks ol { margin: 0; padding-left: 1.2rem; }
  .parks li { margin: .45rem 0; }
  .warn { background: #fff7e6; color: #6b4200; border-color: #f0d199; }
  @media (prefers-color-scheme: dark) { .warn { background: #2b2311; color: #f3d59a; border-color: #5c4a1f; } }
  footer { color: var(--mute); font-size: .8rem; margin: 1.5rem 0 2rem; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>¿Se paga aquí?</h1>
  <p class="sub">La plaza SER donde estás, si se paga ahora y hasta cuándo puedes quedarte. Madrid ciudad.</p>
  <div class="row">
    <button class="go" id="locate">Usar mi ubicación</button>
    <select id="example" aria-label="Probar con un lugar">
      <option value="">…o prueba un lugar</option>
      <option value="40.42700,-3.69463">Génova 10 (verde, azul, alta)</option>
      <option value="40.44593,-3.70193">Treviño 3 (verde y azul)</option>
      <option value="40.42723,-3.72330">Fco. y Jacinto Alcántara (naranja)</option>
      <option value="40.48244,-3.68897">Hospital La Paz (roja)</option>
      <option value="40.44700,-3.72800">Ciudad Universitaria (sin SER)</option>
    </select>
  </div>
  <div id="out" aria-live="polite"></div>
  <footer id="foot"></footer>
</main>
<script type="module">
import { serNow, serAt, indexSegments, nearestParks } from './ser.js';

const COLOURS = { 'Verde': 'var(--verde)', 'Azul': 'var(--azul)', 'Alta Rotación': 'var(--alta)', 'Naranja': 'var(--naranja)', 'Rojo': 'var(--rojo)' };
const LABEL = { 'Verde': 'Plaza verde', 'Azul': 'Plaza azul', 'Alta Rotación': 'Alta rotación', 'Naranja': 'Naranja (disuasorio)', 'Rojo': 'Roja (hospitalario)' };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dist = m => m < 1000 ? `${m}\u00a0m` : `${(m / 1000).toFixed(1).replace('.', ',')}\u00a0km`;

let data, idx, here = null;
// ?now=2026-11-16T10:00%2B01:00 pins the clock, for the render test and for a judge's demo.
const PIN = new URLSearchParams(location.search).get('now');
const clock = () => PIN ? new Date(PIN) : new Date();

function render() {
  if (!data || !here) return;
  const now = clock(), out = [];
  const lastHol = Object.keys(data.hol).sort().at(-1);
  if (lastHol && now.toISOString().slice(0, 10) > lastHol.slice(0, 4) + '-12-31')
    out.push(`<div class="card warn">El calendario de festivos de estos datos acaba en ${lastHol.slice(0, 4)}: hoy se trata como día normal.</div>`);
  const hits = serAt(here, idx);
  if (!hits.length) {
    out.push(`<div class="card"><p class="state">Sin plazas SER a menos de 50 m</p>
      <p class="line">Fuera de la zona SER, o un hueco en los datos. Mira la señal: la señal manda.</p></div>`);
  }
  for (const h of hits) {
    const r = serNow(h.colour, now, data.hol);
    out.push(`<div class="card zone" style="--c:${COLOURS[h.colour]}">
      <h2>${LABEL[h.colour]} <small>${esc(h.street)} ${esc(h.number)} · a ${dist(h.m)}</small></h2>
      <p class="state ${r.paid ? 'paid' : 'free'}">${esc(r.text)}</p>
      ${r.paid ? `<p class="line">${esc(r.stay)}</p><p class="line">${esc(r.leave)}</p>` : `<p class="line">${esc(r.next)}</p>`}
    </div>`);
  }
  const parks = nearestParks(here, data);
  out.push(`<div class="card parks"><h2>Aparcamientos municipales más cercanos</h2><ol>${parks.map(p =>
    `<li><a href="${esc(p.url)}" rel="noopener">${esc(p.name)}</a> · ${dist(p.m)}${p.spaces ? ` · ${esc(p.spaces)} plazas` : ''}<br><span class="mute">${esc(p.hours)}</span></li>`).join('')}</ol></div>`);
  out.push(`<p class="mute">Posición ${here.lat.toFixed(5)}, ${here.lon.toFixed(5)}${here.acc ? ` (±${Math.round(here.acc)} m)` : ''}. Se actualiza cada minuto.</p>`);
  $('out').innerHTML = out.join('');
}

function setHere(lat, lon, acc) {
  here = { lat, lon, acc };
  history.replaceState(null, '', `?lat=${lat.toFixed(5)}&lon=${lon.toFixed(5)}${PIN ? '&now=' + encodeURIComponent(PIN) : ''}`);
  render();
}

$('locate').onclick = () => {
  if (!navigator.geolocation) { $('out').innerHTML = '<div class="card">Este navegador no da la ubicación.</div>'; return; }
  $('out').innerHTML = '<div class="card">Buscando tu posición…</div>';
  navigator.geolocation.getCurrentPosition(
    p => setHere(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
    e => { $('out').innerHTML = `<div class="card">No se pudo obtener la ubicación (${esc(e.message)}). Prueba con un lugar de la lista.</div>`; },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
};
$('example').onchange = e => { if (e.target.value) { const [a, o] = e.target.value.split(',').map(Number); setHere(a, o); } };

data = await (await fetch('data.json')).json();
idx = indexSegments(data);
const q = new URLSearchParams(location.search), qa = parseFloat(q.get('lat')), qo = parseFloat(q.get('lon'));
if (Number.isFinite(qa) && Number.isFinite(qo)) setHere(qa, qo);
$('foot').innerHTML = `Datos: Ayuntamiento de Madrid, <a href="https://datos.madrid.es">datos.madrid.es</a>, CC BY 4.0 —
  ${esc(data.src.files['calles.csv'])} (${data.seg.length.toLocaleString('es')} tramos SER), aparcamientos públicos municipales, calendario laboral.
  La calle de cada plaza es la de esos datos, a 30/09/2026: la ampliación del SER del 3/11/2026 (parte de Opañel y San Isidro) puede no aparecer.
  Horario y tiempos máximos: madrid.es, Servicio de Estacionamiento Regulado. Orientativo: la señal y el parquímetro mandan.`;
setInterval(render, 60000);
</script>
</body>
</html>
